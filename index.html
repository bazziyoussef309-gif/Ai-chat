<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#11141b;
  border-right:1px solid #272c38;
  padding:18px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:25px;
}

.logo span{
  color:#8b6cff;
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid #303644;
  background:#191d26;
  color:white;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:25px;
}

.new-chat:hover{
  background:#242936;
}

.history-title{
  color:#7f8797;
  font-size:12px;
  margin-bottom:10px;
}

.history{
  padding:10px;
  border-radius:8px;
  color:#c8ccd5;
  font-size:14px;
  cursor:pointer;
}

.history:hover{
  background:#1b202a;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid #272c38;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-weight:bold;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:30px 15px 120px;
}

/* WELCOME */

.welcome{
  max-width:700px;
  margin:12vh auto;
  text-align:center;
}

.icon{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(135deg,#7655ff,#a48cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.welcome h1{
  margin-top:20px;
  font-size:36px;
}

.welcome p{
  color:#8d95a5;
  margin-top:10px;
}

.suggestions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:35px;
}

.suggestion{
  padding:18px;
  background:#171a22;
  border:1px solid #292e3a;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
}

.suggestion:hover{
  border-color:#7c5cff;
}

/* MESSAGES */

.message{
  max-width:800px;
  margin:0 auto 25px;
  display:flex;
  gap:12px;
  line-height:1.6;
}

.avatar{
  min-width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.user-avatar{
  background:#303542;
}

.ai-avatar{
  background:linear-gradient(135deg,#7655ff,#a48cff);
}

.content{
  padding-top:5px;
  white-space:pre-wrap;
  word-break:break-word;
}

.name{
  font-size:13px;
  font-weight:bold;
  margin-bottom:4px;
}

.ai-name{
  color:#9b87ff;
}

/* INPUT */

.input-area{
  position:fixed;
  bottom:0;
  left:250px;
  right:0;
  padding:15px 20px;
  background:linear-gradient(transparent,#0b0d12 35%);
}

.input-box{
  max-width:800px;
  margin:auto;
  display:flex;
  padding:7px;
  background:#171a22;
  border:1px solid #303644;
  border-radius:15px;
}

input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  padding:13px;
  font-size:15px;
}

button.send{
  width:45px;
  height:45px;
  border:none;
  border-radius:11px;
  background:#7655ff;
  color:white;
  font-size:20px;
  cursor:pointer;
}

button.send:hover{
  background:#6847ef;
}

.disclaimer{
  text-align:center;
  color:#606878;
  font-size:10px;
  margin-top:7px;
}

/* TYPING */

.typing{
  display:flex;
  gap:5px;
  padding-top:10px;
}

.typing span{
  width:7px;
  height:7px;
  background:#888;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .input-area{
    left:0;
    padding:12px;
  }

  .welcome{
    margin-top:10vh;
  }

  .welcome h1{
    font-size:28px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .message{
    max-width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      Nova <span>AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="history-title">
      Recent Chats
    </div>

    <div id="history"></div>

  </aside>


  <main class="main">

    <header class="topbar">
      Nova AI
    </header>

    <section id="chat">

      <div class="welcome" id="welcome">

        <div class="icon">✦</div>

        <h1>How can I help you?</h1>

        <p>Ask Nova AI anything.</p>

        <div class="suggestions">

          <div class="suggestion"
          onclick="suggest('Explain artificial intelligence simply')">
            💡 Explain something
          </div>

          <div class="suggestion"
          onclick="suggest('Help me write an email')">
            ✍️ Write something
          </div>

          <div class="suggestion"
          onclick="suggest('Give me a programming idea')">
            💻 Programming
          </div>

          <div class="suggestion"
          onclick="suggest('Help me study')">
            📚 Study help
          </div>

        </div>

      </div>

    </section>


    <div class="input-area">

      <div class="input-box">

        <input
        id="input"
        type="text"
        placeholder="Message Nova AI..."
        autocomplete="off">

        <button class="send" onclick="send()">
          ↑
        </button>

      </div>

      <div class="disclaimer">
        Nova AI can make mistakes.
      </div>

    </div>

  </main>

</div>


<script>

const input=document.getElementById("input");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");

input.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    send();
  }

});


function send(){

  const text=input.value.trim();

  if(!text)return;

  welcome.style.display="none";

  addMessage(text,"user");

  input.value="";

  showTyping();

  setTimeout(function(){

    removeTyping();

    const answer=getAnswer(text);

    addMessage(answer,"ai");

    saveHistory(text);

  },900);

}


function addMessage(text,type){

  const div=document.createElement("div");

  div.className="message";

  if(type==="user"){

    div.innerHTML=`

      <div class="avatar user-avatar">
        👤
      </div>

      <div class="content">

        <div class="name">
          You
        </div>

        ${safe(text)}

      </div>
    `;

  }else{

    div.innerHTML=`

      <div class="avatar ai-avatar">
        ✦
      </div>

      <div class="content">

        <div class="name ai-name">
          Nova AI
        </div>

        ${safe(text)}

      </div>
    `;

  }

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;

}


function showTyping(){

  const div=document.createElement("div");

  div.className="message";
  div.id="typing";

  div.innerHTML=`

    <div class="avatar ai-avatar">
      ✦
    </div>

    <div class="content">

      <div class="name ai-name">
        Nova AI
      </div>

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  `;

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;

}


function removeTyping(){

  const typing=document.getElementById("typing");

  if(typing){
    typing.remove();
  }

}


function getAnswer(text){

  const t=text.toLowerCase();

  if(
    t.includes("hello") ||
    t.includes("hi") ||
    t.includes("مرحبا") ||
    t.includes("hey")
  ){

    return "Hello 👋 I'm Nova AI. How can I help you?";

  }


  if(t.includes("python")){

    return "Python is a programming language known for its simple syntax. It is commonly used in AI, automation, cybersecurity, data analysis and web development.";

  }


  if(t.includes("javascript")){

    return "JavaScript is a programming language that makes websites interactive. It can also be used to build web applications and servers.";

  }


  if(
    t.includes("artificial intelligence") ||
    t.includes("what is ai") ||
    t.includes("الذكاء الاصطناعي")
  ){

    return "Artificial Intelligence (AI) is technology that allows computers to perform tasks that normally require human-like abilities, such as understanding language, recognizing patterns and generating content.";

  }


  if(t.includes("help")){

    return "Of course! I can help with programming, studying, writing, explanations and many other topics.";

  }


  return "I received your message:\n\n\"" +
         text +
         "\"\n\nNova AI is currently in demo mode. The next step is connecting this interface to a real AI model.";

}


function suggest(text){

  input.value=text;

  send();

}


function newChat(){

  chat.innerHTML="";

  chat.appendChild(welcome);

  welcome.style.display="block";

  input.focus();

}


function saveHistory(text){

  let history=
    JSON.parse(localStorage.getItem("novaHistory")) || [];

  history.unshift(text);

  history=history.slice(0,8);

  localStorage.setItem(
    "novaHistory",
    JSON.stringify(history)
  );

  loadHistory();

}


function loadHistory(){

  const box=document.getElementById("history");

  box.innerHTML="";

  let history=
    JSON.parse(localStorage.getItem("novaHistory")) || [];

  history.forEach(function(text){

    const item=document.createElement("div");

    item.className="history";

    item.textContent=
      text.length>30
      ? text.substring(0,30)+"..."
      : text;

    item.onclick=function(){

      input.value=text;
      input.focus();

    };

    box.appendChild(item);

  });

}


function safe(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d12;
      --sidebar: #11141b;
      --card: #171a22;
      --border: #272c38;
      --text: #f5f7fa;
      --muted: #9299a8;
      --accent: #7c5cff;
      --accent2: #9b87ff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: var(--accent2);
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .new-chat:hover {
      background: #202532;
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .history {
      color: #c5cad4;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .history:hover {
      background: var(--card);
    }

    .sidebar-bottom {
      margin-top: auto;
      color: var(--muted);
      font-size: 13px;
      padding: 10px;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 22px;
      font-weight: bold;
    }

    .mobile-logo {
      display: none;
    }

    /* CHAT */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px 120px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 750px;
      margin: 13vh auto 0;
      text-align: center;
    }

    .ai-icon {
      width: 65px;
      height: 65px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
      font-size: 31px;
      box-shadow: 0 10px 35px rgba(124, 92, 255, 0.25);
    }

    .welcome h1 {
      margin-top: 22px;
      font-size: 36px;
    }

    .welcome p {
      color: var(--muted);
      margin-top: 10px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 35px;
    }

    .suggestion {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 17px;
      border-radius: 12px;
      color: #d7dbe3;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .suggestion:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* MESSAGES */

    .message {
      max-width: 800px;
      margin: 0 auto 25px;
      display: flex;
      gap: 13px;
      line-height: 1.6;
    }

    .avatar {
      min-width: 35px;
      height: 35px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
    }

    .user-avatar {
      background: #303541;
    }

    .ai-avatar {
      background: linear-gradient(135deg, #7c5cff, #9b87ff);
    }

    .message-content {
      padding-top: 5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-name,
    .ai-name {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .user-name {
      color: #d4d8e0;
    }

    .ai-name {
      color: var(--accent2);
    }

    /* INPUT */

    .input-container {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 35%
      );
    }

    .input-wrapper {
      max-width: 800px;
      margin: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 8px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.25);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 13px;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #737b8b;
    }

    #sendBtn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #6947f0;
    }

    .disclaimer {
      text-align: center;
      color: #656c7a;
      font-size: 11px;
      margin-top: 8px;
    }

    /* TYPING */

    .typing {
      display: flex;
      gap: 5px;
      padding-top: 12px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #858c9b;
      border-radius: 50%;
      animation: typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .sidebar {
        display: none;
      }

      .mobile-logo {
        display: block;
      }

      .topbar {
        justify-content: center;
      }

      .input-container {
        left: 0;
        padding: 12px;
      }

      #chat {
        padding-left: 12px;
        padding-right: 12px;
      }

      .welcome {
        margin-top: 12vh;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .message {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      Nova <span>AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New chat
    </button>

    <div class="history-title">
      Recent chats
    </div>

    <div id="history"></div>

    <div class="sidebar-bottom">
      Nova AI v1.0
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">
      <div class="mobile-logo">
        Nova <span style="color:#9b87ff;">AI</span>
      </div>
    </header>


    <!-- CHAT -->

    <section id="chat">

      <div class="welcome" id="welcome">

        <div class="ai-icon">
          ✦
        </div>

        <h1>How can I help you?</h1>

        <p>
          Ask Nova AI anything.
        </p>

        <div class="suggestions">

          <div class="suggestion"
               onclick="useSuggestion('Explain artificial intelligence simply')">
            💡 Explain something
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Help me write a professional email')">
            ✍️ Write something
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Give me a programming idea')">
            💻 Programming
          </div>

          <div class="suggestion"
               onclick="useSuggestion('Help me study for an exam')">
            📚 Study help
          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-container">

      <div class="input-wrapper">

        <input
          id="messageInput"
          type="text"
          placeholder="Message Nova AI..."
